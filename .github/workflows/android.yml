name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and Build
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o UltraCamPro.zip -d extracted_app
          
          GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: gradlew not found!"
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLE_PATH")
          echo "Found gradlew in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
