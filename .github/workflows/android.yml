name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Pinpoint Exact Error
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Mantenemos la detección automática de la ruta del proyecto
          APP_PATH=$(find extracted_app -name "app" -type d | head -n 1)
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Raíz del proyecto en: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Mantenemos el build.gradle.kts limpio
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          # Mantenemos el settings.gradle.kts configurado
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltraCamPro"
          include(":app")
          EOF
          
          # Mantenemos la configuración del SDK y local.properties
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # Compilamos y enviamos la línea exacta del error a las anotaciones de GitHub
          ./gradlew assembleDebug > build_output.log 2>&1 || {
              echo "----------------------------------------"
              cat build_output.log | grep -A 5 -B 2 "What went wrong" || cat build_output.log | tail -n 30
              echo "----------------------------------------"
              
              # Forzamos una anotación con el error detectado
              REAL_ERROR=$(grep -A 2 "What went wrong" build_output.log | tail -n 1)
              echo "::error::Fallo en Gradle: $REAL_ERROR"
              exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
