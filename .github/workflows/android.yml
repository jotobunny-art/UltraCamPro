name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate and Build Project
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          
          rm -rf extracted_app build_output.log
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Búsqueda estricta de la carpeta raíz del proyecto Android
          APP_PATH=$(find extracted_app -name "app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
              echo "::error::No se encontró ninguna carpeta llamada 'app' en el archivo ZIP."
              exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Carpeta app encontrada en: $APP_PATH"
          echo "Raíz del proyecto establecida en: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Verificar si existe settings.gradle o settings.gradle.kts en la raíz, si no, crearlo
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
              echo "Creando settings.gradle.kts por defecto..."
              cat << 'EOF' > settings.gradle.kts
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "UltraCamPro"
              include(":app")
              EOF
          fi

          # Configurar el build.gradle raíz si no existe
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
              echo "Creando build.gradle.kts raíz..."
              cat << 'EOF' > build.gradle.kts
              plugins {
                  id("com.android.application") version "8.1.1" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.0" apply false
              }
              EOF
          fi

          # Configuración universal de gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          # Configuración del SDK y local.properties
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # Ejecutar compilación y volcar el log completo si ocurre un error
          ./gradlew clean assembleDebug --no-daemon --stacktrace > build_output.log 2>&1 || {
              echo "=========================================="
              echo "=== ERROR DE COMPILACIÓN DETECTADO ==="
              echo "=========================================="
              tail -n 120 build_output.log
              exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
