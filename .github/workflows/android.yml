name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Resource Fix & CompileSdk
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Mantenemos la detección automática de la ruta del proyecto
          APP_PATH=$(find extracted_app -name "app" -type d | head -n 1)
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Raíz del proyecto en: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Mantenemos el build.gradle.kts principal
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          # Mantenemos el settings.gradle.kts configurado
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltraCamPro"
          include(":app")
          EOF
          
          # Mantenemos la configuración de AndroidX y Jetifier
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Solución para processDebugResources: Asegurar compileSdk y namespace correcto en el módulo app
          APP_BUILD_GRADLE="$APP_PATH/build.gradle.kts"
          if [ ! -f "$APP_BUILD_GRADLE" ]; then
              APP_BUILD_GRADLE="$APP_PATH/build.gradle"
          fi
          
          echo "Optimizando configuración en: $APP_BUILD_GRADLE"
          
          # Si el archivo usa groovy (build.gradle), inyectamos o corregimos los valores si es necesario
          if [[ "$APP_BUILD_GRADLE" == *.gradle ]]; then
              sed -i 's/compileSdkVersion.*/compileSdk = 34/g' "$APP_BUILD_GRADLE" || true
              sed -i 's/targetSdkVersion.*/targetSdk = 34/g' "$APP_BUILD_GRADLE" || true
          fi
          
          # Mantenemos la configuración del SDK y local.properties
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # Compilamos con la corrección aplicada
          ./gradlew assembleDebug --stacktrace
