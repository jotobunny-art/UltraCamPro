name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle & Build
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Entrar a la raíz exacta del proyecto
          cd extracted_app/UltraCamPro
          
          # Generar Wrapper moderno (Gradle 8.4) compatible con Java 17
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
