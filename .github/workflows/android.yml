name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Modernized App Gradle
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          
          rm -rf extracted_app build_output.log
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Detección dinámica de la ruta del proyecto
          APP_PATH=$(find extracted_app -name "app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
              echo "::error::No se encontró la carpeta 'app' en el ZIP."
              exit 1
          fi
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Raíz del proyecto en: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Configuración del build.gradle.kts raíz (MANTENIDO)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          # settings.gradle.kts con repositorios seguros (MANTENIDO)
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltraCamPro"
          include(":app")
          EOF
          
          # gradle.properties universal con AndroidX, Jetifier y memoria (MANTENIDO)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          
          # Extraer paquete del AndroidManifest si existe para el namespace
          MANIFEST_FILE="$APP_PATH/src/main/AndroidManifest.xml"
          PKG_NAME="com.ultracam.pro"
          if [ -f "$MANIFEST_FILE" ]; then
              EXTRACTED_PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST_FILE" || true)
              if [ ! -z "$EXTRACTED_PKG" ]; then
                  PKG_NAME="$EXTRACTED_PKG"
              fi
          fi
          echo "Namespace asignado: $PKG_NAME"
          
          # SOLUCIÓN DEFINITIVA: Reemplazar/Crear un build.gradle moderno para el módulo app
          # Esto evita cualquier error de recursos o SDKs obsoletos en el proyecto original
          cat << EOF > "$APP_PATH/build.gradle"
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace '$PKG_NAME'
              compileSdk 34

              defaultConfig {
                  applicationId "$PKG_NAME"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          
          # Configuración del SDK y local.properties (MANTENIDO)
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # Compilación limpia y controlada con volcado completo si llega a fallar
          ./gradlew clean assembleDebug --no-daemon --stacktrace > build_output.log 2>&1 || {
              echo "=========================================="
              echo "=== ERROR CRÍTICO DETECTADO EN GRADLE ==="
              echo "=========================================="
              tail -n 120 build_output.log
              
              FAILED_TASK=$(grep -m 1 "Execution failed for task" build_output.log || echo "Revisar logs detallados arriba")
              echo "::error::$FAILED_TASK"
              exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
