name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Acción oficial de la comunidad)
        uses: gradle/actions/setup-gradle@v3

      - name: Extract project and build
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          unzip -o UltraCamPro.zip -d extracted_app
          cd $(find extracted_app -name "gradlew" -exec dirname {} \;)
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/app-debug.apk'
