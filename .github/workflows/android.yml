name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle & Build
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Buscar automáticamente dónde está settings.gradle.kts o build.gradle y entrar ahí
          PROJECT_DIR=$(find extracted_app -name "build.gradle*" -o -name "settings.gradle*" | head -n 1 | xargs dirname)
          echo "Directorio del proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Crear gradlew y compilar
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
