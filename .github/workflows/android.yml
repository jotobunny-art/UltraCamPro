name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Print Specific Error
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Mantenemos la detección automática de la ruta del proyecto
          APP_PATH=$(find extracted_app -name "app" -type d | head -n 1)
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Raíz del proyecto en: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Mantenemos el build.gradle.kts limpio
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          # Mantenemos el settings.gradle.kts configurado
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltraCamPro"
          include(":app")
          EOF
          
          # Mantenemos la configuración de AndroidX y Jetifier
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          
          # Mantenemos la configuración del SDK y local.properties
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # Compilamos y extraemos el error real en las anotaciones
          ./gradlew assembleDebug > build_output.log 2>&1 || {
              echo "=== MOSTRANDO REGISTRO DE ERROR ==="
              cat build_output.log | tail -n 80
              
              # Extraemos la línea exacta de causa de error
              SPECIFIC_ERR=$(grep -m 1 -E "> Task " build_output.log || echo "Revisar logs abajo")
              echo "::error::Fallo en tarea: $SPECIFIC_ERR"
              exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
