name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Robust App Build Fix
        run: |
          sudo apt-get update && sudo apt-get install -y unzip gradle
          
          rm -rf extracted_app build_output.log
          unzip -o UltraCamPro.zip -d extracted_app
          
          # Detección dinámica de la ruta del proyecto
          APP_PATH=$(find extracted_app -name "app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
              echo "::error::No se encontró la carpeta 'app' en el ZIP."
              exit 1
          fi
          PROJECT_ROOT=$(dirname "$APP_PATH")
          echo "Raíz del proyecto en: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Configuración del build.gradle.kts raíz
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.1.1" apply false
              id("org.jetbrains.kotlin.android") version "1.9.0" apply false
          }
          EOF

          # settings.gradle.kts con repositorios seguros
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltraCamPro"
          include(":app")
          EOF
          
          # gradle.properties universal con AndroidX, Jetifier y memoria
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF
          
          # PARCHE ROBUSTO PARA EL MÓDULO APP: Asegurar namespace y configuración correcta
          APP_BUILD_GRADLE="$APP_PATH/build.gradle"
          if [ ! -f "$APP_BUILD_GRADLE" ]; then
              APP_BUILD_GRADLE="$APP_PATH/build.gradle.kts"
          fi
          
          echo "Archivo de configuración del módulo app encontrado en: $APP_BUILD_GRADLE"
          
          # Extraer paquete del AndroidManifest si existe
          MANIFEST_FILE="$APP_PATH/src/main/AndroidManifest.xml"
          PKG_NAME="com.ultracam.pro"
          if [ -f "$MANIFEST_FILE" ]; then
              EXTRACTED_PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST_FILE" || true)
              if [ ! -z "$EXTRACTED_PKG" ]; then
                  PKG_NAME="$EXTRACTED_PKG"
              fi
          fi
          echo "Namespace configurado: $PKG_NAME"
          
          # Si el archivo existe, aseguramos que tenga el bloque android y el namespace
          if [ -f "$APP_BUILD_GRADLE" ]; then
              # Si no tiene namespace, lo agregamos dentro de android {
              if ! grep -q "namespace" "$APP_BUILD_GRADLE"; then
                  sed -i "/android {/a \    namespace '$PKG_NAME'" "$APP_BUILD_GRADLE" || true
                  sed -i '/android {/a \    namespace = "'$PKG_NAME'"' "$APP_BUILD_GRADLE" || true
              fi
          fi
          
          # Configuración del SDK y local.properties
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          
          # Compilación limpia y controlada con volcado completo si falla
          ./gradlew clean assembleDebug --no-daemon --stacktrace > build_output.log 2>&1 || {
              echo "=========================================="
              echo "=== ERROR CRÍTICO DETECTADO EN GRADLE ==="
              echo "=========================================="
              tail -n 100 build_output.log
              
              FAILED_TASK=$(grep -m 1 "Execution failed for task" build_output.log || echo "Revisar logs detallados arriba")
              echo "::error::$FAILED_TASK"
              exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
